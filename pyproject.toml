[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expense-tracker"
version = "0.1.0"
description = "A CLI expense tracker application designed with SOLID principles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
